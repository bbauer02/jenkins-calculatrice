# Nom de projet fixe : quel que soit le dossier (ou le workspace Jenkins)
# depuis lequel on lance "docker compose", c'est toujours le même projet.
name: calculatrice

services:
  calculatrice:
    build:
      context: .
      dockerfile: Dockerfile
    image: calculatrice:latest
    container_name: calculatrice-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
